# Tells Bing, Yandex and other IndexNow search engines about every page after each deploy.
name: IndexNow ping
on:
  push:
    branches: [main]
    paths: ['site/**']
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for Vercel to deploy
        run: sleep 120
      - name: Submit URLs
        run: |
          KEY=$(cat .indexnow-key)
          URLS=$(grep -o '<loc>[^<]*</loc>' site/sitemap.xml | sed 's/<loc>//;s/<\/loc>//' | python3 -c 'import sys,json;print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          BODY=$(printf '{"host":"www.mycalcbox.in","key":"%s","keyLocation":"https://www.mycalcbox.in/%s.txt","urlList":%s}' "$KEY" "$KEY" "$URLS")
          curl -sS -o /dev/null -w "IndexNow HTTP %{http_code}\n" -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' --data "$BODY"
